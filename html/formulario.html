<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/formulario.css">
    <script src="../js/formulario.js" defer></script>
</head>

<body>

    <div class="container">
        <header>Universidad Central del Ecuador</header>
        <form action="#">
            <nav></nav>
            <section>
                <div class="formulario">
                    <h2>Nuevo Estudiante</h2>
                    <div id="id_msg_error" class="msg_error"></div>
                    <p type="Nombre:"><input id="id_nombre" type="text">
                        <span id="id_error_nombre" class="error_asterisco"></span>
                    </p>
                    <p type="Apellido:"><input id="id_apellido" type="text">
                        <span id="id_error_apellido" class="error_asterisco"></span>
                    </p>
                    <p type="Edad:"><input id="id_edad" type="number">
                        <span id="id_error_edad" class="error_asterisco"></span>
                    </p>
                    <p type="Fecha"><input id="id_fecha" type="date">
                        <span id="id_error_fecha" class="error_asterisco"></span>
                    </p>
                    <p type="Email"><input id="id_email" type="email">
                        <span id="id_error_email" class="error_asterisco"></span>
                    </p>
                    <p type="Password"><input id="id_password" type="password">
                        <span id="id_error_password" class="error_asterisco"></span>
                    </p>
                    <div class="centrar-boton">
                        <button onclick="guardar()">Guardar</button>
                    </div>

        </form>
        </section>
        <aside></aside>
    </div>
    <footer>Todos los derechos reservados &copy;</footer>
    </div>
</body>

</html>
