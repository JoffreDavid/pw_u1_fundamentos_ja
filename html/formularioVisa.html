<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/formularioVisa.css">
    <script src="../js/formularioVisa.js" defer></script>
</head>

<body>


    <div class="container">
        <header></header>
        <div class="img">
            <img src="../img/Visa.png" alt="Visa Logo">
        </div>
        <div class="formulario">
            <nav></nav>
            <section>
                <form action="#">
                    <h1>Paydment Details</h1>
                    <div id="id_msg_error" class="msg_error"></div>
                    <p type="CardHolder Name:"><input id="id_cardholder" type="text" placeholder="Mrs Kate Smith">
                        <span id="id_cardholder_error" class="error_asterisco"></span>
                    </p>
                    <p type="Card Number:"><input id="id_cardnumber" type="text" placeholder="0000 0000 0000 0000" maxlength="16">
                        <span id="id_error_cardnumber" class="error_asterisco"></span>
                    </p>
                    <div class="card_info">
                        <p type="Exp Date"><input id="id_exp_date" type="text" placeholder="MM/YY" maxlength="5"
                                pattern="(0[1-9]|1[0-2])\/\d{2}" required>
                            <span id="id_error_expdate" class="error_asterisco"></span>
                        </p>
                        <p type="CVV"><input id="id_cvv" type="number" placeholder="0000" maxlength="4">
                            <span id="id_error_cvv" class="error_asterisco"></span>
                        </p>
                    </div>
                    <div class="center_boton">
                        <button onclick="confirm()">Confirm</button>
                    </div>
                </form>
        </div>
        </section>
        <aside></aside>
        <footer></footer>
    </div>
</body>

</html>
